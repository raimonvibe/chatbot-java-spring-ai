# Trivy secret scan config: exclude E2E test helpers that use a mock auth token.
# The mock token is NOT a real credential (see frontend/e2e/helpers/test-auth-constants.ts).
# Excluding these paths prevents false-positive "JWT token" alerts in code scanning.
allow-rules:
  - id: e2e-mock-auth
    description: E2E mock auth token - test only, not a real secret
    path: frontend/e2e/.*
  - id: e2e-helpers
    description: E2E helpers and fixtures
    path: frontend/.*/api-mock\.ts
  - id: test-auth-constants
    description: E2E test auth constants file
    path: .*test-auth-constants\.ts
