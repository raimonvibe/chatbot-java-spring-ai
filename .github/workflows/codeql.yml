# CodeQL Analysis
# This workflow is disabled for private repositories without GitHub Advanced Security
# If you have GitHub Advanced Security, you can enable this workflow

name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  workflow_dispatch:

# Disable this workflow if Code Scanning is not enabled
# To enable: Remove the 'if: false' condition below
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: false  # Disabled - Code Scanning requires GitHub Advanced Security for private repos
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

