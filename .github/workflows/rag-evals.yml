name: RAG Evals (Step 3)

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Max cases to run"
        required: false
        default: "12"
      case_types:
        description: "Comma-separated: factual,open-ended,safety"
        required: false
        default: "factual,open-ended,safety"
  schedule:
    - cron: "35 2 * * *"

permissions:
  contents: read

jobs:
  deepeval-smoke:
    name: DeepEval Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: evals/requirements.txt

      - name: Install eval dependencies
        run: python -m pip install -r evals/requirements.txt

      - name: Preflight env check
        id: preflight
        run: |
          if [ -z "${{ secrets.EVAL_BASE_URL }}" ] || [ -z "${{ secrets.EVAL_EMBED_CODE }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping DeepEval: EVAL_BASE_URL and/or EVAL_EMBED_CODE secret is missing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run DeepEval smoke suite
        if: steps.preflight.outputs.skip == 'false'
        env:
          EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
          EVAL_EMBED_CODE: ${{ secrets.EVAL_EMBED_CODE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_CASE_TYPES: ${{ github.event.inputs.case_types || 'factual,open-ended,safety' }}
          EVAL_MAX_CASES: ${{ github.event.inputs.max_cases || '12' }}
          EVAL_G_EVAL_THRESHOLD: "0.65"
          EVAL_REQUIRE_LLM_JUDGE: "false"
        run: pytest -q evals/tests/test_deepeval_chatbot.py
