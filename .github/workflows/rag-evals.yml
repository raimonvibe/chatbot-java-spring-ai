name: RAG Evals (Step 3)

# Manual runs only — avoids hitting prod APIs on every Dependabot/PR update.
on:
  workflow_dispatch:
    inputs:
      max_cases:
        description: "Max cases to run"
        required: false
        default: "5"
      case_types:
        description: "Comma-separated: factual,open-ended,safety"
        required: false
        default: "factual,safety"

permissions:
  contents: read

concurrency:
  group: rag-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deepeval-smoke:
    name: DeepEval Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: evals/requirements.txt

      - name: Install eval dependencies
        run: python -m pip install -r evals/requirements.txt

      - name: Preflight env check
        id: preflight
        run: |
          if [ -z "${{ secrets.EVAL_BASE_URL }}" ] || [ -z "${{ secrets.EVAL_EMBED_CODE }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping DeepEval: EVAL_BASE_URL and/or EVAL_EMBED_CODE secret is missing."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute eval limits from workflow inputs
        if: steps.preflight.outputs.skip == 'false'
        id: evalcfg
        run: |
          echo "max_cases=${{ github.event.inputs.max_cases }}" >> "$GITHUB_OUTPUT"
          echo "case_types=${{ github.event.inputs.case_types }}" >> "$GITHUB_OUTPUT"

      - name: Run DeepEval smoke suite
        id: deepeval
        if: steps.preflight.outputs.skip == 'false'
        env:
          EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
          EVAL_EMBED_CODE: ${{ secrets.EVAL_EMBED_CODE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_CASE_TYPES: ${{ steps.evalcfg.outputs.case_types }}
          EVAL_MAX_CASES: ${{ steps.evalcfg.outputs.max_cases }}
          EVAL_G_EVAL_THRESHOLD: "0.65"
          EVAL_REQUIRE_LLM_JUDGE: "false"
        run: |
          mkdir -p evals/results
          pytest -q --junitxml=evals/results/junit.xml evals/tests/test_deepeval_chatbot.py

      - name: Build markdown summary
        if: always() && steps.preflight.outputs.skip == 'false'
        run: python evals/scripts/build_eval_summary.py

      - name: Upload eval results artifact
        if: always() && steps.preflight.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: rag-eval-results
          path: evals/results/
          retention-days: 7
