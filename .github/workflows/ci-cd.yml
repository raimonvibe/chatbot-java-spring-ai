name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Default permissions - restrict by default, jobs can add specific permissions as needed
permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # Backend Build and Test
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        run: mvn clean test
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: test-secret-key-for-testing-purposes-only-do-not-use-in-production
          JWT_EXPIRATION: 86400000

      - name: Generate test coverage report
        run: mvn jacoco:report
        continue-on-error: true

      - name: Upload test results
        if: failure()  # Only upload on failure to save storage
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 3
          compression-level: 9

      - name: Upload coverage report
        if: failure()  # Only upload on failure to save storage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 3
          compression-level: 9

      - name: Check coverage thresholds
        run: |
          mvn jacoco:check || echo "Coverage below threshold - review required"
        continue-on-error: true

  # Frontend Build and Test
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: failure()  # Only upload on failure to save storage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 3
          compression-level: 9

      - name: Build frontend
        run: npm run build

      # Skip uploading build artifacts - not needed for CI, only for deployment
      # Uncomment if you need build artifacts for deployment
      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: frontend-build
      #     path: frontend/.next/
      #     retention-days: 3

  # E2E Tests with Playwright
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build frontend for E2E
        run: npm run build

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=html,json
        continue-on-error: true

      - name: Upload Playwright report
        if: failure()  # Only upload on failure to save storage
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 3
          compression-level: 9

      - name: Upload Playwright test results
        if: failure()  # Only upload on failure to save storage
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 3
          compression-level: 9

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, e2e-test]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true  # Don't fail if code scanning is not enabled
        with:
          sarif_file: 'trivy-results.sarif'

  # Backend Build (only on main branch)
  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [backend-test, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend JAR
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1  # Keep for 1 day only to minimize storage usage
          compression-level: 9  # Maximum compression

  # Docker Build (optional - uncomment if using Docker)
  # docker-build:
