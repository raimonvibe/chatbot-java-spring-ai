# OWASP ZAP Baseline Scan - SECURITY_AUDIT_PLAN Phase 3.2
# Passive DAST scan (spider + passive rules only; no active attacks). Safe for production.
# Refs: ZAP 2.16 (Jan 2025), zaproxy/action-baseline v0.15.0 (Oct 2025), https://www.zaproxy.org/docs/docker/baseline-scan/
name: OWASP ZAP Baseline

on:
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan (e.g. https://yoursite.com)'
        required: true
        default: 'https://www.zaproxy.org'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          # Manual run: use input. Schedule: use repo variable ZAP_TARGET_URL or default.
          target: ${{ github.event_name == 'workflow_dispatch' && inputs.target_url || vars.ZAP_TARGET_URL || 'https://www.zaproxy.org' }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report
