# =============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# =============================================================================
spring:
  application:
    name: prayer-chat-ai-chatbot
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  
  # =============================================================================
  # JACKSON JSON CONFIGURATION (LocalDateTime serialization)
  # =============================================================================
  jackson:
    serialization:
      write-dates-as-timestamps: false  # Use ISO-8601 strings instead of timestamps
    deserialization:
      adjust-dates-to-context-time-zone: false  # Don't adjust timezone
  
  # =============================================================================
  # DATABASE CONFIGURATION
  # =============================================================================
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:chatbotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: false
        jdbc:
          batch_size: 50  # Optimized for memory: increased from 20 to reduce memory usage during bulk inserts
          batch_versioned_data: true  # Enable batch updates for versioned entities
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  
  # =============================================================================
  # SPRING SESSION CONFIGURATION (Required for OAuth2 on cloud platforms)
  # =============================================================================
  session:
    store-type: jdbc  # Store sessions in database instead of memory
    jdbc:
      initialize-schema: always  # Auto-create session tables
      table-name: SPRING_SESSION  # Default table name
      cleanup-cron: "0 0 * * * *"  # Cleanup expired sessions every hour
    timeout: 4h  # 4 hours session timeout (industry standard for SaaS applications)
  
  # =============================================================================
  # OAUTH2 CONFIGURATION (Conditional - only if GOOGLE_CLIENT_ID is set)
  # =============================================================================
  # OAuth2 is configured manually in SecurityConfig only when GOOGLE_CLIENT_ID is present
  # EnvironmentVariableConfig sets these properties from .env file
  # If not set, empty strings are used to prevent Spring Boot auto-configuration errors
  security:
    oauth2:
      client:
        registration:
          google:
            # These will be set by EnvironmentVariableConfig if GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are available
            # If not available, empty strings prevent Spring Boot from trying to auto-configure OAuth2
            client-id: ${spring.security.oauth2.client.registration.google.client-id:${GOOGLE_CLIENT_ID:}}
            client-secret: ${spring.security.oauth2.client.registration.google.client-secret:${GOOGLE_CLIENT_SECRET:}}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  
  # =============================================================================
  # SPRING AI CONFIGURATION
  # =============================================================================
  ai:
    # Anthropic Claude for conversational AI
    # ANTHROPIC_API_KEY can be set via:
    # 1. Environment variable (system env or .env file via spring-dotenv)
    # 2. Direct property: spring.ai.anthropic.api-key
    anthropic:
      # Spring AI auto-configuration requires this property to be non-empty
      # It will be resolved from ANTHROPIC_API_KEY environment variable
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: https://api.anthropic.com
      chat:
        enabled: true
        options:
          model: claude-3-haiku-20240307
          temperature: 0.7
          max-tokens: 1000
    
    # Cohere for multilingual embeddings
    cohere:
      api-key: ${COHERE_API_KEY:}
      base-url: https://api.cohere.com
      embedding:
        enabled: true
        options:
          model: embed-multilingual-v3.0

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0  # Required for Docker/Render deployments
  # Forward headers for OAuth2 (important when behind proxy)
  forward-headers-strategy: framework
  # Session configuration for OAuth2
  servlet:
    context-path: /
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}  # true for HTTPS (Render uses HTTPS)
        same-site: "none"  # Required for cross-origin requests (frontend on different domain than backend)
        max-age: 14400  # 4 hours (14400 seconds) - matches session timeout
      timeout: 4h  # 4 hours session timeout (industry standard for SaaS)
      tracking-modes: cookie
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    connection-timeout: 60s
    max-connections: 8192
    threads:
      max: 200
      min-spare: 10
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# =============================================================================
# ACTUATOR & HEALTH CHECK CONFIGURATION (CRITICAL FOR RENDER)
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  cloudfoundry:
    enabled: false
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
  metrics:
    enable:
      jvm: true
      system: true
  info:
    env:
      enabled: false

# =============================================================================
# APPLICATION CUSTOM CONFIGURATION
# =============================================================================
app:
  # Base URLs for integration script and frontend redirects
  base-url: ${APP_BASE_URL:https://chatbot-java-spring-ai.onrender.com}
  frontend-url: ${FRONTEND_URL:https://prayer-chat.com}

  # Paid billing (Stripe). When false, checkout/portal/plan APIs return 403; webhooks no-op after verify.
  # Set true and configure stripe.* when launching subscriptions. See docs/FREE_PRODUCT_BILLING.md.
  billing:
    enabled: ${APP_BILLING_ENABLED:false}

  # OAuth JWT: default cookie-only (HttpOnly PC_AUTH). Set AUTH_EXPOSE_JWT_IN_RESPONSE=true for mobile Safari + Bearer in JSON.
  # When true, JWT lifetime is min(jwt.expiration, exposed-bearer-ttl-ms) to limit localStorage XSS window.
  auth:
    expose-jwt-in-oauth-response: ${AUTH_EXPOSE_JWT_IN_RESPONSE:false}
    exposed-bearer-ttl-ms: ${AUTH_EXPOSED_BEARER_TTL_MS:14400000}

  # Security alerting (Phase 2.3) - optional webhook for Slack/PagerDuty/Sentry
  security:
    alert-webhook-url: ${SECURITY_ALERT_WEBHOOK_URL:}
    # Forwarded headers (X-Forwarded-For / X-Real-IP) hardening.
    # Only trust these headers when the immediate sender (remoteAddr) is a known proxy IP range.
    # If you deploy behind a CDN/load balancer, set:
    # - APP_TRUST_FORWARDED_HEADERS=true
    # - APP_TRUSTED_PROXIES=<comma-separated CIDRs>
    proxy:
      trust-forwarded-headers: ${APP_TRUST_FORWARDED_HEADERS:false}
      trusted-proxies: ${APP_TRUSTED_PROXIES:}
  
  # Chatbot settings
  chatbot:
    max-conversation-history: 10
    default-language: en
    supported-languages: en,es,fr,de,it,pt,ru,zh,ja,ko,ar,hi
    session-timeout-minutes: 30
    max-message-length: 2000
  
  # Website crawling/analysis settings (technical crawl ceiling; plan limits also cap per user in ChatbotController)
  website-analysis:
    # Headless browser (Chrome) for SPAs: when Jsoup gets minimal content, retry with headless (requires Chrome/Chromium installed)
    headless-enabled: ${HEADLESS_CRAWL_ENABLED:true}
    max-headless-pages-per-scan: 5
    headless-timeout-seconds: 25
    max-pages: ${WEBSITE_ANALYSIS_MAX_PAGES:500}
    max-depth: 3
    timeout-seconds: 30
    user-agent: "PrayerChatCrawler/1.0 (+https://prayer-chat.com/bot)"
    retry-attempts: 3
    retry-delay-seconds: 2

  # Bible data configuration
  bible:
    # Auto-load Bible data on startup if not already loaded
    auto-load: ${BIBLE_AUTO_LOAD:true}

    # Load Old Testament verses (set to false to only use New Testament)
    load-old-testament: ${BIBLE_LOAD_OLD_TESTAMENT:false}

    # Auto-generate embeddings for all verses (WARNING: Very expensive and time-consuming!)
    # Set to false in production and generate embeddings manually via admin endpoint
    auto-generate-embeddings: ${BIBLE_AUTO_GENERATE_EMBEDDINGS:false}

    # Paths to Bible data files (relative to classpath or file system)
    data:
      old-testament: classpath:data/bible/data/old-testament-data.json
      new-testament: classpath:data/bible/data/new-testament-data.json
  
  # Embedding configuration
  embedding:
    model: embed-multilingual-v3.0
    dimensions: 1024
    batch-size: 100
    cache-enabled: true

  # Cloudflare Turnstile bot protection for the public embed widget chat endpoint.
  # When enabled, the widget must send a Turnstile token with chat requests.
  turnstile:
    enabled: ${APP_TURNSTILE_ENABLED:false}
    site-key: ${APP_TURNSTILE_SITE_KEY:}
    secret-key: ${APP_TURNSTILE_SECRET_KEY:}

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

# CORS Configuration - set CORS_ALLOWED_ORIGINS in production (e.g. https://prayer-chat.com,https://www.prayer-chat.com)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://prayer-chat.com,https://www.prayer-chat.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# =============================================================================
# STRIPE PAYMENT CONFIGURATION
# =============================================================================
stripe:
  api-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Optional: when set, only these IPs can POST to /stripe/webhook (defense-in-depth). Comma-separated. See https://stripe.com/files/ips/ips_webhooks.txt
  webhook-ip-allowlist: ${STRIPE_WEBHOOK_IP_ALLOWLIST:}
  # Default price (used when no plan/priceId specified)
  price-id: ${STRIPE_PRICE_ID:}
  # Optional per-plan Stripe Price IDs (e.g. STRIPE_PRICE_ID_BASIC=price_xxx)
  price-id-basic: ${STRIPE_PRICE_ID_BASIC:}
  price-id-pro: ${STRIPE_PRICE_ID_PRO:}
  price-id-enterprise: ${STRIPE_PRICE_ID_ENTERPRISE:}
  price-amount: 498  # $4.98 in cents (fallback when no price ID)
  price-currency: usd
  product-name: "Prayer-Chat Monthly Subscription"
  # After payment, user lands on Account page where "Share your chatbot" (embed script) is shown
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/account?payment=success&session_id={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/pricing}
  # Allowed hosts for success/cancel URLs (prevents open redirect via misconfiguration)
  allowed-redirect-origins: ${STRIPE_ALLOWED_REDIRECT_ORIGINS:http://localhost:3000,https://prayer-chat.com,https://www.prayer-chat.com}
  grace-period-days: 7
  max-retry-attempts: 3

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  level:
    root: INFO
    com.prayer_chat: ${LOG_LEVEL:INFO}
    org.springframework.ai: WARN
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.boot.web: INFO
    org.hibernate.SQL: ${SHOW_SQL:false}
    org.hibernate.type.descriptor.sql.BasicBinder: ${SHOW_SQL:false}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:/app/logs/prayer-chat.log}
    max-size: 10MB
    max-history: 30

# =============================================================================
# SPRING BOOT PRODUCTION OPTIMIZATIONS
# =============================================================================
spring.jmx.enabled: false
spring.devtools.restart.enabled: false
