version: '3.8'

services:
  # PostgreSQL with pgvector extension for local development
  postgres:
    image: ankane/pgvector:latest
    container_name: chatbot-postgres-dev
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./backend/data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatbot-network

volumes:
  pgvector_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge
