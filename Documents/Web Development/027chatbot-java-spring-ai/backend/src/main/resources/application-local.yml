# Local development profile configuration
# This profile enables admin endpoints and local-only features
#
# To run with this profile:
#   java -jar app.jar --spring.profiles.active=local
#   or set SPRING_PROFILES_ACTIVE=local environment variable
#
# Note: Do NOT set spring.profiles.active in this file - it's a profile-specific config file

# Enable admin endpoints for local development
app:
  admin:
    enabled: true

# Database Configuration - PostgreSQL for local development (required for PgVectorStore)
# Uses Docker Compose PostgreSQL (see docker-compose.dev.yml)
# Start with: docker-compose -f docker-compose.dev.yml up -d
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatbot_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false  # Disable H2 console in local profile since we're using PostgreSQL

