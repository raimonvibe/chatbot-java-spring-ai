# =============================================================================
# NGINX Reverse Proxy Configuration
# =============================================================================
# This configuration provides a single entry point for the application:
# - Frontend (Next.js) served at root /
# - Backend API proxied to /api/*
# - Thymeleaf pages blocked from public access
# - Security headers and rate limiting
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Upstream servers
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Maximum request body size (for file uploads)
        client_max_body_size 10M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Security Headers (applied to all responses)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =============================================================================
    # API Routes - Proxy to Backend
    # =============================================================================
        location /api/ {
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy settings
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering settings
        proxy_buffering off;
        proxy_request_buffering off;

        # CORS will be handled by backend
        }

    # =============================================================================
    # Chatbot Widget - Proxy to Backend
    # =============================================================================
        location ~ ^/(chatbot-widget\.js|css/chatbot-widget\.css)$ {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache static assets
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
        }

    # =============================================================================
    # OAuth/Authentication Routes - Proxy to Backend
    # =============================================================================
        location ~ ^/(login|oauth2|logout)/ {
        limit_req zone=general_limit burst=10 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        }

    # =============================================================================
    # Stripe Webhook - Proxy to Backend
    # =============================================================================
        location /stripe/webhook {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    # =============================================================================
    # Health Check Endpoints
    # =============================================================================
        location ~ ^/(actuator/health|health)$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        access_log off;  # Don't log health checks
        }

    # =============================================================================
    # BLOCKED: Thymeleaf Pages - Return 404
    # =============================================================================
    # Block direct access to server-rendered pages
    # These are for internal/development use only
        location ~ ^/(chatbots|analytics|settings)(/.*)?$ {
        return 404;
        }

    # Block access to backend root (Thymeleaf index page)
        location = /index {
        return 404;
        }

    # =============================================================================
    # Frontend - Proxy to Next.js
    # =============================================================================
        location / {
        limit_req zone=general_limit burst=50 nodelay;

        # Proxy to Next.js frontend
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js HMR (development)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for better performance with Next.js
        proxy_buffering off;
        }

    # =============================================================================
    # Next.js Static Assets
    # =============================================================================
        location /_next/static/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # Cache Next.js static files for a long time
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        }

    # =============================================================================
    # Error Pages
    # =============================================================================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }  # Close server block

